{"name":"Auto 24/7","on":{"workflow_call":{"secrets":{"CLAUDE_CODE_OAUTH_TOKEN":{"required":true},"AUTO247_TOKEN":{"required":true}}}},"jobs":{"claude":{"if":"github.actor == github.repository_owner && ((github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) || (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))","runs-on":"ubuntu-latest","timeout-minutes":30,"permissions":{"contents":"write","pull-requests":"write","issues":"write","id-token":"write","actions":"read"},"outputs":{"branch":"${{ steps.claude.outputs.branch_name }}"},"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"id":"claude","uses":"anthropics/claude-code-action@v1","with":{"claude_code_oauth_token":"${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"}}]},"open-and-merge":{"needs":"claude","if":"needs.claude.outputs.branch != ''","runs-on":"ubuntu-latest","timeout-minutes":20,"steps":[{"name":"Open PR, wait checks, auto merge","env":{"GH_TOKEN":"${{ secrets.AUTO247_TOKEN }}","REPO":"${{ github.repository }}","BASE":"${{ github.event.repository.default_branch }}","BRANCH":"${{ needs.claude.outputs.branch }}","ISSUE":"${{ github.event.issue.number }}","TITLE":"${{ github.event.issue.title }}","BODY":"${{ github.event.issue.body }}"},"run":"set -euo pipefail\nPR_URL=$(gh pr create --repo \"$REPO\" --base \"$BASE\" --head \"$BRANCH\" --title \"$TITLE\" --body \"Closes #$ISSUE (Auto 24/7)\")\necho \"PR: $PR_URL\"\nif [[ \"$TITLE $BODY\" == *\"[manual]\"* ]]; then echo manual-mode; exit 0; fi\nsleep 15\ngh pr checks \"$PR_URL\" --repo \"$REPO\" --watch --required --interval 5\ngh pr merge \"$PR_URL\" --repo \"$REPO\" --squash --delete-branch\necho merged"}]}}}
